# Ambiente local da Fase 0: painel + API + Keycloak (MFA) + Postgres + Redis
# Uso: cp .env.example .env && docker compose up --build  →  http://localhost:3000
name: cloudview

x-api-env: &api-env
  CV_ENV: dev
  CV_DATABASE_URL: postgresql+psycopg://cloudview_app:cloudview_app@postgres:5432/cloudview
  CV_MIGRATION_DATABASE_URL: postgresql+psycopg://cloudview_owner:cloudview_owner@postgres:5432/cloudview
  CV_REDIS_URL: redis://redis:6379/0
  CV_PUBLIC_URL: http://localhost:3000
  CV_OIDC_ISSUER: http://localhost:8080/realms/cloudview
  CV_OIDC_INTERNAL_BASE: http://keycloak:8080/realms/cloudview
  CV_OIDC_CLIENT_ID: cloudview-bff
  CV_OIDC_CLIENT_SECRET: ${KC_BFF_CLIENT_SECRET:-dev-only-secret-change-me}
  CV_COOKIE_SECURE: "false"

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-kcadmin}
      KC_BFF_CLIENT_SECRET: ${KC_BFF_CLIENT_SECRET:-dev-only-secret-change-me}
      CV_PUBLIC_URL: http://localhost:3000
    volumes:
      - ./infra/keycloak/realm-cloudview.json:/opt/keycloak/data/import/realm-cloudview.json:ro
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  keycloak-seed:
    image: quay.io/keycloak/keycloak:26.1.4
    entrypoint: ["/bin/bash", "/seed/dev-seed.sh"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-kcadmin}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@cloudview.local}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-ChangeMe!12345}
    volumes:
      - ./infra/keycloak/dev-seed.sh:/seed/dev-seed.sh:ro
    depends_on: [keycloak]
    restart: "no"

  migrate:
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: ./apps/api
    environment: *api-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
