name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      CV_TEST_PG_OWNER_URL: postgresql+psycopg://cloudview_owner:owner@localhost:5432/cloudview
      CV_TEST_PG_APP_URL: postgresql+psycopg://cloudview_app:app@localhost:5432/cloudview
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv && uv pip install -e '.[dev]'
      - run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Testes (SQLite)
        run: .venv/bin/pytest -q
      - name: Prepara Postgres de teste
        run: sh ../../infra/local/postgres-init.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          OWNER_DB_PASSWORD: owner
          APP_DB_PASSWORD: app
          KEYCLOAK_DB_PASSWORD: kc
      - name: Testes (Postgres + RLS)
        run: .venv/bin/pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/setup.sh
      - run: docker compose config --quiet
      - name: Valida Caddyfile (local e com domínio)
        run: |
          for site in "http://" "painel.exemplo.com"; do
            docker run --rm -e CV_SITE_ADDRESS="$site" -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
              caddy:2.8.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
      - name: Sobe a stack e checa saúde
        run: |
          docker compose up -d --build --wait --wait-timeout 600 caddy
          curl -fsS http://localhost:8080/api/healthz
          curl -fsS -o /dev/null http://localhost:8080/auth/realms/cloudview/.well-known/openid-configuration
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/tenants)" = "401"
      - if: failure()
        run: docker compose logs --no-color | tail -300

  terraform-opcional:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/optional/aws-ecs
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
