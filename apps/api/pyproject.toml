[project]
name = "cloudview-api"
version = "0.1.0"
description = "Cloud View API / BFF"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "authlib>=1.3",
  "email-validator>=2.2",
  "python-multipart>=0.0.12",
  "boto3>=1.35",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fakeredis>=2.23", "ruff>=0.6", "moto[ec2,organizations,sts,s3]>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501"]  # comprimento de linha fica a cargo do formatter

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["S608"]  # SQL de DDL montado só com constantes do código
"tests/*" = ["S603", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
